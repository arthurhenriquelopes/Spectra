name: Build Installer Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Install electron-builder
      run: npm install --save-dev electron-builder

    - name: Build x64 NSIS Installer
      run: npx electron-builder --win nsis --x64
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          dist/Spectra-Installer-amd64.exe
        draft: false
        prerelease: false
        generate_release_notes: true
        body: |
          ## Spectra AI - Desktop Copilot

          **Instalador completo** — inclui Electron, Node.js e todas as dependencias. Basta instalar e usar.

          ### Requisitos
          - Windows 10 (64-bit) ou superior

          ### Instalacao
          1. Baixe `Spectra-Installer-amd64.exe`
          2. Execute o instalador (SmartScreen pode exibir aviso — clique **"Mais informacoes"** → **"Executar assim mesmo"**)
          3. Escolha o diretorio de instalacao
          4. Pronto!

          > **Nota:** Como ferramenta open-source, o Windows SmartScreen pode exibir um aviso azul. Clique em **"Mais informacoes"** → **"Executar assim mesmo"**.
