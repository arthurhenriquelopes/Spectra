name: Lint
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Syntax check JavaScript
      run: |
        node -c electron/main.js
        node -c electron/preload.js
        node -c electron/server/server.js
        node -c electron/server/session.js
        node -c electron/server/llm.js
        node -c electron/server/stt.js
        node -c electron/server/prompts.js
        node -c web/js/spectra-ui.js
        echo "All JS files passed syntax check."
