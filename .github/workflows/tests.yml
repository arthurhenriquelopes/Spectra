name: Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Verify package integrity
      run: |
        node -e "const pkg = require('./package.json'); console.log('Package:', pkg.name, 'v' + pkg.version); console.log('Main:', pkg.main); const fs = require('fs'); if (!fs.existsSync(pkg.main)) { console.error('Main entry point not found:', pkg.main); process.exit(1); } console.log('Entry point exists.');"
        echo "Package validation passed."
