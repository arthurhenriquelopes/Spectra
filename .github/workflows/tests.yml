name: Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Windows-specific dependencies for Linux CI
      run: |
        # Pywebview and win32 APIs require mocking or OS specifics in Linux
        # For CI purposes, we install standard dependencies
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-asyncio
        pip install -r requirements.txt
        
    - name: Run Pytest with Coverage
      env:
        # Mock env vars if needed
        DEEPGRAM_API_KEY: "dummy_key"
      run: |
        pytest tests/ --cov=src --cov-report=xml --cov-report=term
